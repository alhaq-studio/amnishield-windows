name: Build & Release AmnShield Multi-Platform

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version from pubspec.yaml
        id: version
        shell: powershell
        run: |
          $content = Get-Content pubspec.yaml -Raw
          if ($content -match 'version:\s*(\S+)') {
            $fullVersion = $matches[1] -replace '\+.*$', ''
            echo "VERSION=$fullVersion" >> $env:GITHUB_OUTPUT
            echo "TAG=v$fullVersion" >> $env:GITHUB_OUTPUT
            Write-Host "Detected version: $fullVersion (tag: v$fullVersion)"
          } else {
            Write-Error "Could not extract version from pubspec.yaml"
            exit 1
          }

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Portable Zip
        shell: powershell
        run: |
          $tag = "${{ steps.version.outputs.TAG }}"
          New-Item -ItemType Directory -Force -Path "artifacts"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "artifacts\AmnShield-Windows-$tag-x64.zip" -Force

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          refreshenv

      - name: Compile Installer with Inno Setup
        shell: powershell
        run: |
          $tag = "${{ steps.version.outputs.TAG }}"
          New-Item -ItemType Directory -Force -Path "releases"

          # Find Inno Setup compiler
          $isccPath = $null
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            (Get-Command "iscc" -ErrorAction SilentlyContinue).Source
          )
          foreach ($c in $candidates) {
            if ($c -and (Test-Path $c)) { $isccPath = $c; break }
          }
          if (-not $isccPath) {
            Write-Warning "Inno Setup not found — skipping installer compilation"
            exit 0
          }

          Write-Host "Using Inno Setup Compiler: $isccPath"
          & "$isccPath" installer.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Inno Setup compilation failed"
          } else {
            Write-Host "Successfully compiled AmnShield installer" -ForegroundColor Green
            Get-ChildItem -Path "releases\*.exe" | Copy-Item -Destination "artifacts"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/*

  build-macos:
    name: Build macOS Desktop App
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -n 1 | awk '{print $2}' | sed 's/\+.*//')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION (tag: v$VERSION)"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Package macOS App
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          mkdir -p artifacts
          cd build/macos/Build/Products/Release
          zip -r "../../../../../artifacts/AmnShield-macOS-$TAG-x64.zip" amnshield_flutter.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/*

  build-linux:
    name: Build Linux Desktop App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -n 1 | awk '{print $2}' | sed 's/\+.*//')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION (tag: v$VERSION)"

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev lld llvm

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Linux Bundle
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          mkdir -p artifacts
          cd build/linux/x64/release/bundle
          zip -r "../../../../../artifacts/AmnShield-Linux-$TAG-x64.zip" .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/*

  build-web:
    name: Build Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -n 1 | awk '{print $2}' | sed 's/\+.*//')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION (tag: v$VERSION)"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Web Release
        run: flutter build web --release

      - name: Package Web Release
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          mkdir -p artifacts
          cd build/web
          zip -r "../../artifacts/AmnShield-Web-$TAG.zip" .

      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-artifacts
          path: artifacts/*

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux, build-web]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -n 1 | awk '{print $2}' | sed 's/\+.*//')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release_files

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: release_files

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release_files

      - name: Download Web Artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-artifacts
          path: release_files

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: AmnShield Guardian ${{ steps.version.outputs.TAG }} (Cross-Platform)
          body: |
            ## 🛡️ AmnShield Guardian ${{ steps.version.outputs.TAG }}

            Cross-platform digital wellness and desktop focus enforcement application for **Windows**, **macOS**, **Linux**, and **Web**.

            ### ✨ Features
            - **Desktop App Blocker**: Block distracting desktop applications with real-time process monitoring
            - **Web Domain Filter**: 50,000+ domain pack support with Adult & Social Media domain packs
            - **Usage Tracker**: Real-time app & website screentime tracking with daily time limits
            - **Browser Extension Sync**: Local HTTP API server on `127.0.0.1:48192` for live rule sync with AmnShield extension
            - **ECDSA License Verification**: Offline NIST P-256 cryptographic license key validation
            - **Cross-Platform**: Windows, macOS, Linux desktop builds & web app support

            ### 📦 Downloads
            | Platform | File | Description |
            |----------|------|-------------|
            | **Windows** | `AmnShield-Windows-${{ steps.version.outputs.TAG }}-x64.zip` | Portable version |
            | **Windows** | `AmnShield-Setup-*.exe` | Windows Installer |
            | **macOS** | `AmnShield-macOS-${{ steps.version.outputs.TAG }}-x64.zip` | macOS App bundle |
            | **Linux** | `AmnShield-Linux-${{ steps.version.outputs.TAG }}-x64.zip` | Linux Portable bundle |
            | **Web** | `AmnShield-Web-${{ steps.version.outputs.TAG }}.zip` | Web app build |

            ### 🔒 Privacy
            - 100% local processing — zero telemetry, zero cloud data collection

            ---
            Built with ❤️ by **Al-Haq Studio** | [amnishield.com](https://amnishield.com)
          draft: false
          prerelease: false
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
