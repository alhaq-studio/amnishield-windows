name: Build & Release AmnShield Windows

on:
  push:
    branches:
      - main
      - restructure
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Test Windows Desktop App
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Release Assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "build_zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build_zip\AmnShield-Windows-v7.29.2026-x64.zip" -Force

      - name: Compile Installer with Inno Setup
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "installer_output"
          $isccPath = (Get-Command "iscc" -ErrorAction SilentlyContinue).Source
          if (-not $isccPath) {
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
              $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
            } else {
              Write-Error "Inno Setup Compiler (ISCC.exe) not found on runner!"
              exit 1
            }
          }
          Write-Host "Using Inno Setup Compiler: $isccPath"
          & "$isccPath" installer.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compilation failed with exit code $LASTEXITCODE"
            exit 1
          }
          if (-not (Test-Path "installer_output\AmnShield-Setup-v7.29.2026.exe")) {
            Write-Error "Installer binary not generated at installer_output\AmnShield-Setup-v7.29.2026.exe"
            exit 1
          }
          Write-Host "Successfully compiled AmnShield-Setup-v7.29.2026.exe" -ForegroundColor Green

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/restructure'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v7.29.2026' }}
          name: AmnShield Guardian Windows ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v7.29.2026' }}
          body: |
            ## 🕌 AmnShield Guardian for Windows v7.29.2026
            - **Standalone Installer Package**: Prebuilt `.exe` setup wizard for automatic process monitoring, hosts redirection, and service installation.
            - **Non-Admin HTTP Service Engine**: Native Dart loopback socket binding on `http://127.0.0.1:48192/` for 100% non-elevated sync.
            - **Live Extension Sync**: Real-time status polling for Chrome & Edge extension connection.
            - **Enterprise Policy Enforcement**: Prevents extension deletion via Chromium `ExtensionInstallForcelist`.
            - **Strict Engine Toggles**: Instantly activates/deactivates web domain blocking across system `hosts` file and extension.
            - **50,000+ Domain Support**: Fast Set-based streaming of prebuilt packs.
          draft: false
          prerelease: false
          files: |
            build_zip/AmnShield-Windows-v7.29.2026-x64.zip
            installer_output/AmnShield-Setup-v7.29.2026.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
