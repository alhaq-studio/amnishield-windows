name: Build & Release AmnShield Windows

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Release Windows Desktop App
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version from pubspec.yaml
        id: version
        shell: powershell
        run: |
          $content = Get-Content pubspec.yaml -Raw
          if ($content -match 'version:\s*(\S+)') {
            $fullVersion = $matches[1] -replace '\+.*$', ''
            echo "VERSION=$fullVersion" >> $env:GITHUB_OUTPUT
            echo "TAG=v$fullVersion" >> $env:GITHUB_OUTPUT
            Write-Host "Detected version: $fullVersion (tag: v$fullVersion)"
          } else {
            Write-Error "Could not extract version from pubspec.yaml"
            exit 1
          }

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Portable Zip
        shell: powershell
        run: |
          $tag = "${{ steps.version.outputs.TAG }}"
          New-Item -ItemType Directory -Force -Path "build_zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build_zip\AmnShield-Windows-$tag-x64.zip" -Force

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          refreshenv

      - name: Compile Installer with Inno Setup
        shell: powershell
        run: |
          $tag = "${{ steps.version.outputs.TAG }}"
          New-Item -ItemType Directory -Force -Path "releases"

          # Find Inno Setup compiler
          $isccPath = $null
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            (Get-Command "iscc" -ErrorAction SilentlyContinue).Source
          )
          foreach ($c in $candidates) {
            if ($c -and (Test-Path $c)) { $isccPath = $c; break }
          }
          if (-not $isccPath) {
            Write-Warning "Inno Setup not found — skipping installer compilation"
            exit 0
          }

          Write-Host "Using Inno Setup Compiler: $isccPath"
          & "$isccPath" installer.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Inno Setup compilation failed — portable zip will still be uploaded"
          } else {
            Write-Host "Successfully compiled AmnShield installer" -ForegroundColor Green
          }

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: AmnShield Guardian Windows ${{ steps.version.outputs.TAG }}
          body: |
            ## 🛡️ AmnShield Guardian for Windows ${{ steps.version.outputs.TAG }}

            ### ✨ Features
            - **Desktop App Blocker**: Block distracting Windows apps with real-time process monitoring (2.5s enforcement loop)
            - **Web Domain Filter**: 50,000+ domain pack support with Adult & Social Media domain packs
            - **Usage Tracker**: Real-time app & website screentime tracking with daily time limits
            - **Browser Extension Sync**: Local HTTP API server on `127.0.0.1:48192` for live rule sync with AmniShield Chrome/Edge/Firefox extension
            - **Extension Enforcement**: Anti-uninstall via Chromium ExtensionInstallForcelist policy (Pro feature)
            - **ECDSA License Verification**: Offline NIST P-256 cryptographic license key validation
            - **Onboarding Wizard**: First-run setup with protection goal selection
            - **Passcode Lock**: Parental/admin passcode for settings protection
            - **3 Color Themes**: Emerald Green, Cosmic Dark, Deep Navy & Gold
            - **Stripe Checkout**: Direct Supporter Pass purchase via Supabase Edge Function

            ### 📦 Downloads
            | File | Description |
            |------|-------------|
            | `AmnShield-Windows-${{ steps.version.outputs.TAG }}-x64.zip` | Portable version (extract & run) |
            | `AmnShield-Setup-*.exe` | Windows installer with service registration |

            ### 🔒 Privacy
            - 100% local processing — zero telemetry, zero cloud data collection
            - All filtering and blocking runs on your machine only

            ---
            Built with ❤️ by **Al-Haq Studio** | [amnishield.com](https://amnishield.com)
          draft: false
          prerelease: false
          files: |
            build_zip/AmnShield-Windows-${{ steps.version.outputs.TAG }}-x64.zip
            releases/AmnShield-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
