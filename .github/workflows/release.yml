name: Build & Release AmnShield Windows

on:
  push:
    branches:
      - main
      - restructure
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Test Windows Desktop App
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Release Assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "build_zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build_zip\AmnShield-Windows-x64.zip" -Force

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/restructure'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.4' }}
          name: AmnShield Guardian Windows ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.4' }}
          body: |
            ## 🕌 AmnShield Guardian for Windows v1.0.4
            - **Non-Admin HTTP Service Engine**: Native Dart loopback socket binding on `http://127.0.0.1:48192/` for 100% non-elevated sync.
            - **Live Extension Sync**: Real-time status polling for Chrome & Edge extension connection.
            - **Enterprise Policy Enforcement**: Prevents extension deletion via Chromium `ExtensionInstallForcelist`.
            - **Strict Engine Toggles**: Instantly activates/deactivates web domain blocking across system `hosts` file and extension.
            - **50,000+ Domain Support**: Fast Set-based streaming of prebuilt packs.
          draft: false
          prerelease: false
          files: |
            build_zip/AmnShield-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
